# 每天自動抓桃園機場班表，更新 flights.json（台灣時間 02:00、10:00、18:00）
name: Update flights

on:
  schedule:
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh flights.json
        env:
          TZ: Asia/Taipei
        run: python3 update_flights.py
      - name: Commit if changed
        run: |
          if git diff --quiet flights.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add flights.json
          git commit -m "Update flights.json"
          git push
